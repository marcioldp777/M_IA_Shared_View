<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Sala TV · Ferramentas</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:12px Segoe UI,Arial,sans-serif;user-select:none}
.box{background:#141d2c;border:1px solid #3b4960;border-radius:14px;color:#edf2fc;box-sizing:border-box}
.row{display:flex;align-items:center;gap:3px;height:50px;box-sizing:border-box;padding:6px 8px 6px 4px}
.options{height:44px;padding:0 8px 6px 26px;border-top:1px solid #29364b}
.grip{-webkit-app-region:drag;width:18px;height:100%;flex:none;display:flex;align-items:center;justify-content:center;color:#5d6b82;cursor:move}
button{-webkit-app-region:no-drag;flex:none;width:36px;height:36px;border:0;border-radius:9px;background:transparent;color:#edf2fc;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
button:hover{background:#26344b}
button.active{background:#69e6be;color:#09241e}
button:disabled{opacity:.3;cursor:default;background:transparent}
.sep{flex:none;width:1px;height:26px;background:#29364b;margin:0 4px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#close svg{width:15px;height:15px}
#share{color:#69e6be}#share.live{color:#ff5a52}#share.live:hover{background:#4a1f24}
#board.black{background:#edf2fc;color:#0b0b0b}
#timer{-webkit-app-region:no-drag;flex:none;width:52px;text-align:center;font:600 14px Consolas,monospace;color:#a4b1c7;cursor:pointer;border-radius:8px;padding:8px 0}
#timer:hover{background:#26344b}#timer.live{color:#edf2fc}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid #3b4960}
.swatch.active{outline:2px solid #edf2fc;outline-offset:2px;border-color:#141d2c}
.size span{display:block;border-radius:50%;background:currentColor}
.label{color:#7f8ca3;margin:0 4px 0 2px}
[hidden]{display:none!important}
</style>
<body><div class="box">
<div class="row">
<div class="grip" title="Arraste para mover"><svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></svg></div>
<button data-tool="pointer" title="Apontador (Ctrl+Alt+1)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="12" r="8"/></svg></button>
<button data-tool="laser" title="Caneta laser: o traço some sozinho (Ctrl+Alt+6)"><svg viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg></button>
<button data-tool="pen" title="Caneta (Ctrl+Alt+2)"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
<button data-tool="highlighter" title="Marca-texto (Ctrl+Alt+3)"><svg viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg></button>
<button data-tool="shape" title="Formas: seta, retângulo, círculo, linha (Ctrl+Alt+7)"><svg viewBox="0 0 24 24"><rect x="3" y="12" width="9" height="9" rx="1"/><circle cx="16.5" cy="7.5" r="4.5"/></svg></button>
<button data-tool="eraser" title="Borracha: clique ou passe sobre um desenho (Ctrl+Alt+8)"><svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l9.6-9.6a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L11 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button>
<div class="sep"></div>
<button data-tool="magnifier" title="Lupa (Ctrl+Alt+4)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6M8 11h6"/></svg></button>
<button data-tool="spotlight" title="Holofote: escurece tudo menos o redor do mouse (Ctrl+Alt+9)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
<button data-tool="select" title="Zoom por seleção (Ctrl+Alt+5)"><svg viewBox="0 0 24 24"><path d="M3 7V3h4M17 3h4v4M21 17v4h-4M7 21H3v-4"/><path d="M9 12h6M12 9v6"/></svg></button>
<div class="sep"></div>
<button id="undo" title="Desfazer último desenho (Ctrl+Alt+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/></svg></button>
<button id="clear" title="Limpar desenhos (Ctrl+Alt+0)"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg></button>
<button id="off" title="Desligar ferramentas, quadro e zoom (Esc)"><svg viewBox="0 0 24 24"><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/><path d="M12 2v10"/></svg></button>
<div class="sep"></div>
<button id="board" title="Quadro branco → quadro preto → desligado"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20l4-4 4 4"/></svg></button>
<button id="freeze" title="Congelar imagem na TV"><svg viewBox="0 0 24 24"><path d="M12 2v20M4.9 6.5l14.2 11M4.9 17.5l14.2-11"/><path d="m9 4 3 2 3-2M9 20l3-2 3 2"/></svg></button>
<button id="black" title="Tela preta na TV"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2" fill="currentColor"/><path d="M8 21h8M12 17v4"/></svg></button>
<button id="mute" title="Silenciar TV"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path class="sound" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/><path class="muted" d="m22 9-6 6M16 9l6 6"/></svg></button>
<div class="sep"></div>
<button id="share" title="Compartilhar tela ou aplicação"><svg viewBox="0 0 24 24"><path class="play" d="M7 4v16l13-8z" fill="currentColor"/><rect class="stop" x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg></button>
<div id="timer" title="Tempo de apresentação (clique para zerar)">00:00</div>
<div class="sep"></div>
<button id="close" title="Fechar caixa flutuante"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
</div>
<div class="row options" id="options" hidden>
<span class="label">Cor</span><div id="colors" style="display:flex;gap:6px"></div>
<div class="sep"></div>
<span class="label">Espessura</span>
<button class="size" data-size="s" title="Fino"><span style="width:5px;height:5px"></span></button>
<button class="size" data-size="m" title="Médio"><span style="width:9px;height:9px"></span></button>
<button class="size" data-size="l" title="Grosso"><span style="width:15px;height:15px"></span></button>
<div id="shapes" style="display:flex;align-items:center;gap:3px"><div class="sep"></div><span class="label">Forma</span>
<button data-shape="arrow" title="Seta"><svg viewBox="0 0 24 24"><path d="M5 19 19 5M10 5h9v9"/></svg></button>
<button data-shape="rect" title="Retângulo"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
<button data-shape="ellipse" title="Círculo"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg></button>
<button data-shape="line" title="Linha"><svg viewBox="0 0 24 24"><path d="M5 19 19 5"/></svg></button>
</div>
</div>
</div><script src="toolbar.js"></script></body></html>
